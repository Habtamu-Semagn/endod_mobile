# The Endod app: checks on every change, and builds/releases on demand.
#
# Checks (every pull request and push to main): typecheck, lint, brand colours.
#
# Release (Actions -> "Mobile" -> Run workflow), with EXPO_TOKEN and
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON from the repository secrets:
#   check            - the credentials work (Expo account, project, Play key); no build
#   build            - Android production build (AAB, version bumped by EAS), kept as an artifact
#   build-and-submit - the same, then uploaded to the Play Store internal track
# The app is built on this runner (eas build --local) with the signing key
# stored on EAS, so it does not use the Expo plan's monthly cloud builds.
name: Mobile

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [check, build, build-and-submit]
        default: check

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (an Android build needs about 15 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Play Store key (eas.json reads it from this path; never committed)
        env:
          KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KEY" || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is empty"; exit 1; }
          printf '%s' "$KEY" > play-store-service-account.json
          node -e '
            const k = JSON.parse(require("fs").readFileSync("play-store-service-account.json", "utf8"));
            if (k.type !== "service_account" || !k.client_email || !k.private_key) throw new Error("not a service account key");
            console.log("Play key OK for project", k.project_id);'

      - name: Expo account and project
        run: |
          eas whoami
          eas project:info

      - name: Build (Android, production)
        if: inputs.action != 'check'
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: eas build --platform android --profile production --local --non-interactive --output endod.aab

      - uses: actions/upload-artifact@v4
        if: inputs.action != 'check'
        with:
          name: endod-android
          path: endod.aab
          retention-days: 14

      - name: Submit to the Play Store (internal track)
        if: inputs.action == 'build-and-submit'
        run: eas submit --platform android --profile production --path endod.aab --non-interactive

      - name: Remove the Play key
        if: always()
        run: rm -f play-store-service-account.json
